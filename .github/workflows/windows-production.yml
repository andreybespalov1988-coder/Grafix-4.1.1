name: Grafix 4.1.2 Windows Production Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Electron
        shell: pwsh
        run: |
          $v = (npx electron --version).Trim()
          if ($v -ne "v38.8.6") { throw "Unexpected Electron version: $v" }
      - name: UI acceptance
        run: npm run test:electron-ui
      - name: Security audit
        run: npm run test:security
      - name: Build Windows
        run: npm run dist:win -- --publish never
      - name: Verify packaged files and hashes
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "release"
          $installer = Join-Path $dir "Grafix-4.1-Setup.exe"
          $portable = Join-Path $dir "Grafix-4.1-Portable.exe"
          $asar = Join-Path $dir "win-unpacked/resources/app.asar"
          if (!(Test-Path $installer)) { throw "Installer missing" }
          if (!(Test-Path $portable)) { throw "Portable missing" }
          if (!(Test-Path $asar)) { throw "app.asar missing" }
          $lines = @()
          foreach ($p in @($installer,$portable,$asar)) {
            $h = (Get-FileHash -Algorithm SHA256 $p).Hash
            $lines += "$h  $($p.Substring($env:GITHUB_WORKSPACE.Length + 1).Replace('','/'))"
          }
          $lines | Set-Content -Encoding utf8 (Join-Path $dir "SHA256SUMS.txt")
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Grafix-4.1.2-Installer
          path: release/Grafix-4.1-Setup.exe
          if-no-files-found: error
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Grafix-4.1.2-Portable
          path: release/Grafix-4.1-Portable.exe
          if-no-files-found: error
      - name: Upload unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: Grafix-4.1.2-win-unpacked
          path: release/win-unpacked/**
          if-no-files-found: error
      - name: Upload hashes
        uses: actions/upload-artifact@v4
        with:
          name: Grafix-4.1.2-SHA256
          path: release/SHA256SUMS.txt
          if-no-files-found: error
